name: Release

on:
  push:
    tags:
      - 'v*'

# Builds installers as workflow artifacts only. Nothing is published to GitHub Releases
# (electron-builder.yml sets `publish: null` and every build passes `--publish never`).
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

  build-windows:
    needs: verify
    runs-on: windows-latest
    # `secrets.*` isn't a recognized named-value inside step `if:` conditions, so mirror it into
    # a job-level env var and let the VirusTotal step skip when the secret isn't configured.
    env:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Build (Windows)
        run: npm run build:win -- --publish never

      - name: Scan installer with VirusTotal
        if: env.VT_API_KEY != ''
        run: |
          $installer = Get-ChildItem -Path dist -Filter *-setup.exe | Select-Object -First 1 -ExpandProperty FullName
          node scripts/scan-virustotal.mjs "$installer" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*-setup.exe
          if-no-files-found: error

  build-mac:
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # No Apple Developer ID configured, so this build is ad-hoc signed only, not notarized
      # (see electron-builder.yml `mac` section). CSC_IDENTITY_AUTO_DISCOVERY=false stops
      # electron-builder from looking for a keychain certificate that doesn't exist on this runner.
      - name: Build (macOS)
        run: npm run build:mac -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
